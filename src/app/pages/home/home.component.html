<div class="home-page">

    <div class="first">
        <div class="header">
            <img class="img" src="assets/img/logo.png" alt="asda">
        </div>

        <div class="first-content">
            <div class="content">
                <div class="main-phrase">
                    <h1 class="h1">Encontre seu melhor amigo</h1>
                </div>
                <div class="secondary-phrase">
                    <h2 class="h2">Adote animais que são compatíveis com a sua necessidade.</h2>
                </div>
                <div class="ver-animais-btn">
                    <button class="btn-entrar" (click)="login()">Entrar</button>
                    <button class="btn-registrar" (click)="redirectTo('main-page')">Ver animais</button>

                </div>
            </div>
        </div>
    </div>

    <div class="third">
    
        <div class="third-tittle">
            <h1 class="h1">Nossos Animais</h1>
        </div>
        <div class="third-content">
            <div class="animal" *ngFor="let a of animais">
            <div class="animal-pfp">
                <img class="img" [src]="a.foto" [alt]="a.nome" />
            </div>
            <div class="animal-content">
                <h3 class="h3">{{ a.nome }}</h3>
                <p class="p">{{ a.especie }} — {{ a.idade }} anos</p>
                <p class="p">{{ a.descricao }}</p>
            </div>
            </div>
        </div>

        <div class="third-btn">
            <button class="btn-ver-animais" (click)="redirectTo('main-page')">Ver mais</button>
        </div>
    </div>

    <div class="footer">
        <div class="logo-div">
            <img class="img" src="/assets/img/logo-branca.png" alt="logo fada org">
        </div>
        <div class="info-div">
            <div class="left">
                <div class="spam-div">
                    <a href="https://www.instagram.com/fadaorg/" target="_blank" rel="noopener noreferrer" class="insta-link">
                        <mat-icon svgIcon="instagram"></mat-icon>
                        <span>Instagram</span>
                    </a>
                </div>
            </div>
            <div class="right">
                <p>2025 &copy;</p>
            </div>
        </div>
    </div>
</div>
