<div class="animal-card" (click)="abrirDetalhes()">
  <img [src]="animal.photo" [alt]="animal.name" class="photo" />
  <h3>{{ animal.name }}</h3>
  <p>{{ animal.species }} • {{ animal.breed }}</p>
  <p>{{ animal.age }} anos • {{ animal.sex }}</p>
  <p>{{ animal.size }}</p>
  <span class="status" [class]="animal.status.toLowerCase()">{{ animal.status }}</span>
</div>
