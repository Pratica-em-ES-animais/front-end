<div class="animal-card" (click)="abrirDetalhes()">
  <div class="header-bar"></div>

  <div class="photo-wrapper">
    <img [src]="animal.photo" [alt]="animal.name" />
    <span class="status-tag" [class]="animal.status.toLowerCase()">
      {{ animal.status }}
    </span>
  </div>

  <div class="animal-info">
    <h3>{{ animal.name }}</h3>
    <p class="species">{{ animal.species }} • {{ animal.breed }}</p>

    <div class="tags">
      <span class="tag">{{ animal.age }} anos</span>
      <span class="tag">{{ animal.sex }}</span>
      <span class="tag">{{ animal.size }}</span>
    </div>
  </div>
</div>
