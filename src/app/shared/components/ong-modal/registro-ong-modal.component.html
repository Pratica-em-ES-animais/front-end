

<form [formGroup]="ongForm" (ngSubmit)="onSubmit()">
  <mat-dialog-content class="content">
    <div class="row">
      <mat-form-field appearance="outline" class="field">
        <mat-label>Nome da ONG</mat-label>
        <input matInput formControlName="name" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>CNPJ</mat-label>
        <input matInput formControlName="cnpj" />
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline" class="field full-width">
        <mat-label>E-mail</mat-label>
        <input matInput type="email" formControlName="email" />
      </mat-form-field>
    </div>

    <div class="row">
      <mat-form-field appearance="outline" class="field small">
        <mat-label>DDD</mat-label>
        <input matInput formControlName="ddd" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="field">
        <mat-label>Telefone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
    </div>

    <div formGroupName="address">
      <div class="row">
        <mat-form-field appearance="outline" class="field">
          <mat-label>CEP</mat-label>
          <input matInput type="number" formControlName="cep" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="field small">
          <mat-label>UF</mat-label>
          <input matInput formControlName="uf" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="field small">
          <mat-label>Número</mat-label>
          <input matInput type="number" formControlName="numero" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline" class="field">
          <mat-label>Cidade</mat-label>
          <input matInput formControlName="cidade" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="field">
          <mat-label>Bairro</mat-label>
          <input matInput formControlName="bairro" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline" class="field full-width">
          <mat-label>Logradouro</mat-label>
          <input matInput formControlName="logradouro" />
        </mat-form-field>
      </div>

      <div class="row">
        <mat-form-field appearance="outline" class="field full-width">
          <mat-label>Complemento</mat-label>
          <input matInput formControlName="complemento" />
        </mat-form-field>
      </div>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="onCancel()">
      Fechar
    </button>

    <button mat-raised-button color="primary" type="submit">
      Salvar
    </button>
  </mat-dialog-actions>
</form>
